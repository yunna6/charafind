<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>角色图鉴 · 这个角色出自哪部作品？</title>
    <meta
      name="description"
      content="角色图鉴：搜索二次元角色，查清 TA 出自哪部动漫或游戏，浏览作品全员角色，看热度排行榜，点赞收藏并留下评论。"
    />
    <meta name="theme-color" content="#f7f4ef" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23c2417a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23fff' font-family='serif'%3E%E8%A7%92%3C/text%3E%3C/svg%3E" />
    <script>
      // 首屏前应用主题，避免明暗闪烁
      try {
        var qs = new URLSearchParams(location.search).get('theme');
        var saved = localStorage.getItem('charafind-theme');
        var dark = qs === 'dark' || qs === 'light'
          ? qs === 'dark'
          : (saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
